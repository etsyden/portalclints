services:

  postgres:
    image: postgres:17
    container_name: portalclints-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portalclints
      POSTGRES_USER: portalclints
      POSTGRES_PASSWORD: portalclints_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portalclints -d portalclints"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: portalclints-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  mailpit:
    image: axllent/mailpit:latest
    container_name: portalclints-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  postgres_data:
  redis_data:
